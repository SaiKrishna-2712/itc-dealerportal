_schema-version: "3.2"
ID: com-itc-dealerportal
version: 0.0.1
modules:
- name: com-itc-dealerportal-router
  type: approuter.nodejs
  path: router
  requires:
  - name: com-itc-dealerportal-html5-repo-runtime
  - name: com-itc-dealerportal-auth
  - name: com-itc-dealerportal-destination-service
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  - name: com-itc-dealerportal-connectivity
  parameters:
    disk-quota: 256M
    memory: 256M
- name: com-itc-dealerportal-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: com-itc-dealerportal-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comitcdealerportal.zip
      name: comitcdealerportal
      target-path: resources/
- name: comitcdealerportal
  type: html5
  path: dealerportal
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: com-itc-dealerportal-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: com-itc-dealerportal-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-name: com-itc-dealerportal-xsuaa-service
    service-plan: application
- name: com-itc-dealerportal-html5-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: com-itc-dealerportal-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: com-itc-dealerportal-destination-service
    service-plan: lite
- name: com-itc-dealerportal-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: com-itc-dealerportal-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: com-itc-dealerportal-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
